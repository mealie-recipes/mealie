apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-compile-datasets
  namespace: mealie-prod
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: batch-compile-datasets
              image: python:3.11-slim
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: shared-env
              env:
                - name: TRAINING_BUCKET
                  value: training-data
                - name: DATASET_VERSION
                  value: current
                - name: POSTGRES_SERVER
                  value: postgres.platform.svc.cluster.local
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: mealie
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: password
              command:
                - /bin/sh
                - -lc
              args:
                - |
                  set -euo pipefail
                  pip install --no-cache-dir boto3 pandas pyarrow psycopg2-binary >/tmp/pip.log 2>&1
                  python - <<'PY'
                  import json
                  import os
                  from datetime import datetime
                  from io import BytesIO

                  import boto3
                  import pandas as pd
                  import psycopg2

                  bucket = os.environ["TRAINING_BUCKET"]
                  dataset_version = os.environ.get("DATASET_VERSION", "current")
                  endpoint = os.environ["MINIO_ENDPOINT"]
                  access = os.environ["MINIO_ACCESS_KEY"]
                  secret = os.environ["MINIO_SECRET_KEY"]

                  pg_host = os.environ["POSTGRES_SERVER"]
                  pg_port = int(os.environ.get("POSTGRES_PORT", "5432"))
                  pg_db = os.environ["POSTGRES_DB"]
                  pg_user = os.environ["POSTGRES_USER"]
                  pg_pass = os.environ["POSTGRES_PASSWORD"]

                  s3 = boto3.client(
                      "s3",
                      endpoint_url=endpoint,
                      aws_access_key_id=access,
                      aws_secret_access_key=secret,
                  )
                  try:
                      s3.head_bucket(Bucket=bucket)
                  except Exception:
                      s3.create_bucket(Bucket=bucket)

                  query = """
                  SELECT
                    ur.user_id,
                    ur.recipe_id,
                    ur.rating,
                    COALESCE(ur.update_at, ur.created_at) AS ts,
                    STRING_AGG(t.name, '||') AS tag_blob
                  FROM users_to_recipes ur
                  JOIN recipes r ON r.id = ur.recipe_id
                  LEFT JOIN recipes_to_tags rt ON rt.recipe_id = r.id
                  LEFT JOIN tags t ON t.id = rt.tag_id
                  WHERE ur.rating IS NOT NULL
                  GROUP BY ur.user_id, ur.recipe_id, ur.rating, COALESCE(ur.update_at, ur.created_at)
                  ORDER BY ts ASC
                  """

                  conn = psycopg2.connect(
                      host=pg_host, port=pg_port, dbname=pg_db,
                      user=pg_user, password=pg_pass,
                  )
                  df = pd.read_sql_query(query, conn)
                  conn.close()

                  if df.empty:
                      raise SystemExit("No user ratings found in Postgres; ETL cannot build datasets yet")

                  df["timestamp"] = pd.to_datetime(df["ts"], errors="coerce").fillna(pd.Timestamp.utcnow())
                  df["rating"] = df["rating"].astype(float)
                  df["tags"] = df["tag_blob"].fillna("").apply(
                      lambda raw: [tag for tag in raw.split("||") if tag]
                  )
                  df = df[["user_id", "recipe_id", "rating", "tags", "timestamp"]].sort_values("timestamp")

                  cut = max(1, int(len(df) * 0.8))
                  if cut >= len(df):
                      cut = len(df) - 1
                  train = df.iloc[:cut].copy()
                  val = df.iloc[cut:].copy()

                  def upload_parquet(frame: pd.DataFrame, key: str) -> None:
                      buf = BytesIO()
                      frame.to_parquet(buf, index=False)
                      buf.seek(0)
                      s3.put_object(Bucket=bucket, Key=key, Body=buf.getvalue())

                  prefix = f"datasets/{dataset_version}"
                  upload_parquet(train, f"{prefix}/train.parquet")
                  upload_parquet(val, f"{prefix}/val.parquet")

                  manifest = {
                      "dataset_version": dataset_version,
                      "generated_at": datetime.utcnow().isoformat(),
                      "train_rows": int(len(train)),
                      "val_rows": int(len(val)),
                      "unique_users": int(df["user_id"].nunique()),
                      "unique_recipes": int(df["recipe_id"].nunique()),
                  }
                  s3.put_object(
                      Bucket=bucket,
                      Key=f"{prefix}/meta.json",
                      Body=json.dumps(manifest, indent=2).encode("utf-8"),
                  )
                  print(json.dumps(manifest, indent=2))
                  PY
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
