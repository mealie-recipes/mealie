# Provisioned by Ansible — do NOT commit a real token to git.
# Ansible vault variable: hf_token
# HF_REPO defaults to proj18biasvariance/mealie-ml-artifacts (set in ConfigMap or here).
#
# To apply manually on a fresh cluster:
#   kubectl apply -f k8s/secrets/hf-token-secret.yaml
# (after substituting {{ hf_token }} with the real token)
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: training
type: Opaque
stringData:
  HF_TOKEN: "{{ hf_token }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: data
type: Opaque
stringData:
  HF_TOKEN: "{{ hf_token }}"
