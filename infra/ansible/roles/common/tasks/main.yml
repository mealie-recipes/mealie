- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - jq
      - python3
      - python3-pip
    state: present
    update_cache: true

- name: Ensure project directory exists
  ansible.builtin.file:
    path: /home/cc/proj18
    state: directory
    owner: cc
    group: cc
    mode: "0755"
