name: Crowdin Probe (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Crowdin approval cleanup
        run: python dev/scripts/crowdin_cleanup.py
        env:
          CROWDIN_API_KEY: ${{ secrets.CROWDIN_API_KEY }}
          # Dry run unless "true"
          CROWDIN_CLEANUP_APPLY: "true"
