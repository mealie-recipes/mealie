name: Docker Nightly Production

on:
  push:
    branches:
      - mealie-next
    paths-ignore:
      - '*.md'
      - '.devcontainer/**'
      # I'm not excluding .github as changes in there might be to workflows etc
      - '.vscode/**'
      - 'docs/**'

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: "Backend Server Tests"
    uses: ./.github/workflows/test-backend.yml

  frontend-tests:
    name: "Frontend Tests"
    uses: ./.github/workflows/test-frontend.yml

  build-package:
    name: Build Package
    uses: ./.github/workflows/build-package.yml
    with:
      tag: nightly

  e2e-image-cache:
    name: "Build E2E Image Cache"
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Retrieve Python package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: backend-dist
          path: dist

      # Keep the build arguments in step with e2e.yml, or PR builds miss this cache.
      - name: Build image into the cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          file: ./docker/Dockerfile
          context: .
          build-contexts: |
            packages=dist
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    permissions:
      contents: read
      packages: write
      # The id-token write permission is needed to connect to Depot.dev
      # as part of the partial-builder.yml action. It needs to be declared
      # in the parent action, as noted here:
      # https://github.com/orgs/community/discussions/76409#discussioncomment-8131390
      id-token: write
    name: Build Tagged Release
    if: github.repository == 'mealie-recipes/mealie'
    uses: ./.github/workflows/publish.yml
    needs:
      - frontend-tests
      - backend-tests
      - build-package
    with:
      tag: nightly
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  notify-discord:
    name: Notify Discord
    if: github.repository == 'mealie-recipes/mealie'
    needs:
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK }}
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # 0.4.0
        with:
          args: "🚀  New builds of ghcr.io/mealie-recipes/mealie:nightly"
