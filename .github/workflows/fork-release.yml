name: Fork Release

# Releases for this fork. Upstream's release.yml needs secrets this fork does
# not have (commit bot, Docker Hub, Depot), so it is skipped here and this
# workflow is used instead.
#
# To cut a release:
#   1. Bump the version in a PR: `task fork:version -- 3.28.0+redesign.2`
#   2. Once that is merged, tag the merge commit and push the tag:
#        git tag v3.28.0-redesign.2 && git push origin v3.28.0-redesign.2
#
# The tag must match the package version, with `-` in place of `+`.

on:
  push:
    tags:
      - "v*-redesign.*"

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check tag matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v6

      - name: Compare versions
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" | tr '+' '-')"
          FRONTEND="v$(jq -r .version frontend/package.json | tr '+' '-')"
          if [ "$TAG" != "$EXPECTED" ] || [ "$TAG" != "$FRONTEND" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml ($EXPECTED) and frontend/package.json ($FRONTEND)"
            exit 1
          fi

  backend-tests:
    name: "Backend Server Tests"
    needs: check-version
    uses: ./.github/workflows/test-backend.yml

  frontend-tests:
    name: "Frontend Tests"
    needs: check-version
    uses: ./.github/workflows/test-frontend.yml

  build-package:
    name: Build Package
    needs: check-version
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    name: Build and push image
    needs:
      - backend-tests
      - frontend-tests
      - build-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v6

      - name: Retrieve Python package
        uses: actions/download-artifact@v6
        with:
          name: backend-dist
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which ghcr.io requires
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile
          context: .
          build-contexts: |
            packages=dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v6

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          {
            echo "Docker image: \`${IMAGE}\` (also tagged \`latest\`), for linux/amd64 and linux/arm64."
            echo
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
