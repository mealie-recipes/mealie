name: Deploy Documentation

on:
  push:
    branches: [mealie-next]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Install from the committed lockfile; never re-resolve (see pyproject
      # [tool.uv] exclude-newer cooling window).
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: python uv

      - name: Install dependencies
        run: uv sync --only-group docs --no-install-project

      - name: Build docs
        run: uv run --no-project zensical build
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
