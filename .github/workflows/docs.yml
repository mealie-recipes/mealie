name: Deploy Documentation

on:
  push:
    branches: [mealie-next]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Install from the committed lockfile; never re-resolve (see pyproject
      # [tool.uv] exclude-newer cooling window).
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up tools
        uses: ./.github/actions/setup-tools
        with:
          tools: python uv

      - name: Install dependencies
        run: uv sync --only-group docs --no-install-project

      - name: Build docs
        run: uv run --no-project zensical build
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
