name: Build Package

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: false
        type: string

jobs:
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Work around pnpm/action-setup v6 resolving the wrong version from package.json
      # https://github.com/pnpm/action-setup/issues/227
      - name: Read pnpm version
        id: pnpm-version
        run: 'echo "version=$(jq --raw-output ''.packageManager | split("@")[1]'' package.json)" >> "$GITHUB_OUTPUT"'
        working-directory: "frontend"
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Setup node env 🏗
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --prefer-offline
        working-directory: "frontend"

      - name: Run Build 🚚
        run: pnpm generate
        working-directory: "frontend"

      - name: Archive built frontend
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  build-package:
    name: Build Python package
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Retrieve built frontend
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: mealie/frontend

      - name: Override __init__.py
        run: |
          echo "__version__ = \"${{ inputs.tag }}\"" > ./mealie/__init__.py

      - name: Build package and requirements.txt
        env:
          SKIP_PACKAGE_DEPS: true
        run: |
          task py:package

      - name: Archive built package
        uses: actions/upload-artifact@v6
        with:
          name: backend-dist
          path: dist
          retention-days: 5
