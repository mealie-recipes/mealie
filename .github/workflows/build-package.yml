name: Build Package

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: false
        type: string

jobs:
  build-package:
    name: Build frontend and wheel
    runs-on: ubuntu-latest

    steps:
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup node env 🏗
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --prefer-offline
        working-directory: "frontend"

      - name: Run Build 🚚
        run: pnpm generate
        working-directory: "frontend"

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Copy the frontend into the package
        run: |
          rm -rf mealie/frontend
          cp -a frontend/dist mealie/frontend

      - name: Override __init__.py
        run: |
          echo "__version__ = \"${{ inputs.tag }}\"" > ./mealie/__init__.py

      - name: Build package and requirements files
        env:
          SKIP_PACKAGE_DEPS: true
        run: |
          task py:package

      - name: Archive built package
        uses: actions/upload-artifact@v6
        with:
          name: backend-dist
          path: dist
          retention-days: 5
