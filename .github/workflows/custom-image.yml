name: Publish custom Mealie image

on:
  push:
    branches: [mealie-next]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-mealie-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select immutable image tag
        id: image
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/charlesday/mealie:${{ steps.image.outputs.tag }}
          build-args: |
            COMMIT=${{ github.sha }}
            RECIPE_PRESS_URL=${{ vars.RECIPE_PRESS_URL || 'http://paprika-recipe-generator.home.arpa' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-home-utility:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Request pinned Home Utility update
        env:
          GH_TOKEN: ${{ secrets.MEALIE_AUTOMATION_TOKEN }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/${{ github.repository_owner }}/home-utility/dispatches \
            --method POST \
            --field event_type=mealie-image-published \
            --field "client_payload[repository]=ghcr.io/charlesday/mealie" \
            --field "client_payload[tag]=$IMAGE_TAG" \
            --field "client_payload[digest]=$IMAGE_DIGEST" \
            --field "client_payload[source_sha]=${{ github.sha }}"
