name: Build Containers

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      tags:
        required: false
        type: string
      dockerhub:
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry (dockerhub)
        if: inputs.dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: depot/setup-action@v1

      - name: Retrieve Python package
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist

      - name: Set Docker tags
        env:
          GHCR_TAG: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          DOCKERHUB_TAG: hkotel/mealie:${{ inputs.tag }}
        id: docker_tags
        run: |

          if [ "${{ inputs.dockerhub }}" = "true" ]; then
            TAGS="${GHCR_TAG},${DOCKERHUB_TAG}"
          else
            TAGS="${GHCR_TAG}"
          fi

          if [ -n "${{ inputs.tags }}" ]; then
            TAGS="$TAGS,${{ inputs.tags }}"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image, via Depot.dev
        uses: depot/build-push-action@v1
        with:
          project: srzjb6mhzm
          file: ./docker/Dockerfile
          context: .
          build-contexts: |
            packages=dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          build-args: |
            COMMIT=${{ github.sha }}
