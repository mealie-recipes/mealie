name: E2E Tests
on:
  workflow_call:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tests/e2e
    steps:
      - uses: actions/checkout@v6
      # Work around pnpm/action-setup v6 resolving the wrong version from package.json
      # https://github.com/pnpm/action-setup/issues/227
      - name: Read pnpm version
        id: pnpm-version
        run: 'echo "version=$(jq --raw-output ''.packageManager | split("@")[1]'' package.json)" >> "$GITHUB_OUTPUT"'
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Retrieve Python package
        uses: actions/download-artifact@v6
        with:
          name: backend-dist
          path: dist
      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile
          context: .
          build-contexts: |
            packages=dist
          push: false
          load: true
          tags: mealie:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy E2E Test Environment
        run: docker compose up -d
        working-directory: ./tests/e2e/docker
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps
      - name: Check test environment
        run: docker ps
      - name: Run Playwright tests
        run: pnpm playwright test
      - name: Destroy Test Environment
        if: always()
        run: docker compose down --volumes
        working-directory: ./tests/e2e/docker
