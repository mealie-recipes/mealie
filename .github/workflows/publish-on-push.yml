name: Publish Containers On Push

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-package:
    name: Build Package
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ github.sha }}

  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
    name: Publish Containers
    uses: ./.github/workflows/publish.yml
    needs:
      - build-package
    with:
      tag: ${{ github.sha }}
      tags: |
        sulc/mealie:latest
        ghcr.io/${{ github.repository }}:latest
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
