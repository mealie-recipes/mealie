name: 'Setup Python Backend'
description: 'Setup Python, Poetry, and dependencies for backend testing'
inputs:
  install-postgres:
    description: 'Whether to install psycopg2-binary for PostgreSQL support'
    required: false
    default: 'false'
  cache-key:
    description: 'External cache key to restore from (skips internal caching)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ github.token }}

    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv (external)
      id: cached-external-dependencies
      if: inputs.cache-key != ''
      uses: actions/cache/restore@v3
      with:
        path: |
          ~/.cache/pypoetry
          .venv
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true

    - name: Load cached venv (internal)
      id: cached-poetry-dependencies
      if: inputs.cache-key == ''
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Check venv cache
      id: cache-validate
      if: inputs.cache-key == '' && steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "import fastapi;print('venv good?')" > test.py && poetry run python test.py && echo "cache-hit-success=true" >> $GITHUB_OUTPUT
        rm test.py
      continue-on-error: true

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install libsasl2-dev libldap2-dev libssl-dev
        poetry install
        if [ "${{ inputs.install-postgres }}" = "true" ]; then
          poetry add "psycopg2-binary==2.9.9"
        fi
      if: inputs.cache-key == '' && (steps.cached-poetry-dependencies.outputs.cache-hit != 'true' || steps.cache-validate.outputs.cache-hit-success != 'true')
